{
  "files": {
    "data/feature_expression.csv": {
      "required": [
        "cell_id",
        "umap_1",
        "umap_2",
        "gene",
        "expression"
      ],
      "unique": [
        "cell_id",
        "gene"
      ],
      "constraints": [
        "finite numeric coordinates and expression",
        "expression >= 0",
        "same cells in each gene",
        "coordinates consistent for each cell"
      ]
    }
  },
  "parameters": {
    "expression_max": "null for input maximum, or positive value covering every expression"
  }
}
